[project]
name = "holosim"
version = "0.4.9"
description = "Holo/Sim - Tamper-evident append-only chain for AI continuity and long-term memory"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Canyon Haney", email = "deathburgerz013@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
holo = "holosim.holo_cli:main"

[project.urls]
Homepage = "https://github.com/Deathburgerz013/HOLO-Invariant"
Repository = "https://github.com/Deathburgerz013/HOLO-Invariant"

[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "build",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["holosim*"]

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]
collect = [
    "arxiv>=2.0",
    "sentence-transformers",
    "scikit-learn",
]
dev = [
    "hypothesis>=6.100",
    "mcp>=2,<3",
    "jsonschema>=4.23",
    "pytest>=8.0",
]
