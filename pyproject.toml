[project]
name = "holosim"
version = "0.2.0"
description = "HoloSim — Minimal tamper-evident append-only continuity engine with corrections loop"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Canyon Brock Haney", email = "deathburgerz013@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Deathburgerz013/HOLO-Invariant"
Repository = "https://github.com/Deathburgerz013/HOLO-Invariant"
"Bug Tracker" = "https://github.com/Deathburgerz013/HOLO-Invariant/issues"

[build-system]
requires = ["setuptools>=45", "wheel", "build"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["holosim*"]