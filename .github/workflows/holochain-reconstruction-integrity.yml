name: HoloChain Reconstruction Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holochain-reconstruction-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify HoloChain reconstruction integrity
        run: >
          python -m pytest -q
          tests/test_holochain_diagnostic_decoder_agreement.py
          tests/test_holochain_diagnostic_reconstruction.py
          tests/test_holochain_terminal_tail_diagnosis.py
          tests/test_replay_compressed_search.py
