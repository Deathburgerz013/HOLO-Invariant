name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check generated README status
        run: python -m holosim.readme_status --check

      - name: Verify PR pytest collection continuity
        if: github.event_name == 'pull_request'
        env:
          HOLO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m holosim.pytest_collection_ci_gate --base-sha "$HOLO_BASE_SHA"

      - name: Run full test suite
        run: python -m pytest -q --ignore=Holo