name: Invariant Breaker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariant-breaker-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify invariant breaker contract
        run: python -m pytest -q tests/test_bounded_invariant_breaker.py