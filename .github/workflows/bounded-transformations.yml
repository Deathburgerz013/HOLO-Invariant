name: Bounded Transformations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transformation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify bounded transformation contracts
        run: |
          python -m pytest -q \
            tests/test_bounded_transformation_engine.py \
            tests/test_hash_bound_transformation_validation.py \
            tests/test_transformation_receipt_verifier.py \
            tests/test_validated_bounded_transformation.py \
            tests/test_verify_validated_transformation_receipts.py
