name: HoloSim Collection Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holosim-collection-check
  cancel-in-progress: false

jobs:
  collection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with collection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[collect,dev]"

      - name: Compile collection modules
        run: |
          python -m py_compile holosim/collector.py
          python -m py_compile holosim/x_delta_ingestor.py
          python -m py_compile holosim/generalizer.py

      - name: Run invariant tests
        run: |
          python -m pytest tests/ -q

      - name: Run HoloSim self-test
        run: |
          python -m holosim.cli test

      - name: Verify chain
        run: |
          python -m holosim.cli verify